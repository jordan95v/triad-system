[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "config"]

[project]
name = "parking-lot-api"
description = "An API for managing parking lot data and operations."
version = "0.0.1"
requires-python = ">=3.13"
readme = "README.md"
keywords = ["parking", "api", "management"]
authors = [
    { name = "Jordan Dufresne", email = "j.dufresne@myskolae.fr" },
    { name = "Romain Lancelot", email = "r.lancelot@myskolae.fr" },
    { name = "Ethan François", email = "e.francois@myskolae.fr" },
]
maintainers = [
    { name = "Jordan Dufresne", email = "j.dufresne@myskolae.fr" },
    { name = "Romain Lancelot", email = "r.lancelot@myskolae.fr" },
    { name = "Ethan François", email = "e.francois@myskolae.fr" },
]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "django>=6.0.1",
    "django-filter>=25.2",
    "djangorestframework>=3.16.1",
    "markdown>=3.10.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-env>=1.2.0",
    "pytest-mock>=3.15.1",
    "python-dotenv>=1.2.1",
]

[tool.pytest.ini_options]
addopts = "-vv --tb=short --cov=core --cov-report=term-missing"

[tool.coverage.run]
omit = ["**/__init__.py", "**/config/*"]

[tool.mypy]
ignore_missing_imports = true
